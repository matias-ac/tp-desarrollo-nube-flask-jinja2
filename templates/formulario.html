{% extends 'base.html' %}

{% block content %}
<h2>Formulario de registro</h2>

<form method="POST">
  
  <label for="nombre">Nombre:</label>
  <input type="text" name="nombre"><br>
  {% with messages = get_flashed_messages(category_filter=["nombre_error"]) %}
    {% if messages %}
      <span>{{ messages[0] }}</span><br>
    {% endif %}
  {% endwith %}

  Email: <input type="email" name="email"><br>
  <input type="submit" value="Enviar">

</form>
{% endblock %}
